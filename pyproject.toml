[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "consistency-readout"
version = "0.1.0"
description = "Consistency readout from frozen scientific representations"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24.0", "scipy>=1.10.0", "threadpoolctl>=3.0.0", "scikit-learn>=1.3.0"]

[project.optional-dependencies]
extract = ["torch>=2.4", "transformers>=4.56.2,<6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["consistency_readout*"]
